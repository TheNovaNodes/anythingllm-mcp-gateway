[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-memory-gateway"
version = "0.2.0"
description = "MCP server providing semantic memory access through AnythingLLM vector store"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "TheNovaNodes"}]
keywords = ["mcp", "memory", "anythingllm", "vector", "embeddings", "ai", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
nova-memory-gateway = "memory_gateway.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_gateway*"]