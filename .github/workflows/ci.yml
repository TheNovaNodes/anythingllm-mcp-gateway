name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify Dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Run Tests
        run: go test -v -race -cover ./internal/...
      - name: Build Binary
        run: go build -v -ldflags="-s -w" -o bin/anythingllm-gateway .
